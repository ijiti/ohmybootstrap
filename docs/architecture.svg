<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1180" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif">
  <defs>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <!-- Monochrome glyphs to replace color emoji -->
    <g id="glyphFolder">
      <path d="M 1 4 L 1 14 L 15 14 L 15 6 L 8 6 L 6 4 Z" fill="none" stroke="#64748b" stroke-width="1.4" stroke-linejoin="round"/>
    </g>
    <g id="glyphHome">
      <path d="M 8 2 L 1 8 L 3 8 L 3 14 L 13 14 L 13 8 L 15 8 Z" fill="none" stroke="#64748b" stroke-width="1.4" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="1100" height="1180" fill="#ffffff"/>

  <!-- ============ TITLE ============ -->
  <text x="550" y="48" text-anchor="middle" font-size="30" font-weight="600" fill="#0f172a">ohmybootstrap</text>
  <text x="550" y="76" text-anchor="middle" font-size="15" fill="#64748b">A Claude Code setup kit. Point a session at the repo; the agent installs and tunes it for your project.</text>

  <!-- ============ ZONE 1: THE KIT ============ -->
  <rect x="60" y="110" width="980" height="200" rx="14" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Numeral anchor -->
  <circle cx="84" cy="110" r="18" fill="#0f172a"/>
  <text x="84" y="116" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1</text>
  <text x="112" y="106" font-size="14" font-weight="700" fill="#0f172a">The kit</text>
  <text x="112" y="122" font-size="11" fill="#64748b">cloned somewhere on disk</text>

  <!-- APPLY.md — protagonist card, slate-900 -->
  <rect x="84" y="146" width="232" height="148" rx="10" fill="#0f172a"/>
  <text x="100" y="170" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="1.5">▶ RUN THIS</text>
  <text x="100" y="200" font-size="20" font-weight="700" fill="#ffffff">APPLY.md</text>
  <text x="100" y="222" font-size="12" fill="#cbd5e1">an 11-step recipe a Claude</text>
  <text x="100" y="238" font-size="12" fill="#cbd5e1">session walks to adapt</text>
  <text x="100" y="254" font-size="12" fill="#cbd5e1">your project.</text>
  <rect x="100" y="266" width="200" height="20" rx="10" fill="#1e293b"/>
  <text x="200" y="280" text-anchor="middle" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="0.5">APPROVAL AT EVERY WRITE</text>

  <!-- Right side: 4×2 grid of artifacts (color-coded by lifecycle role) -->
  <!-- Row 1 -->
  <g font-size="13">
    <!-- CLAUDE.md.template (blue, auto-loaded role) -->
    <rect x="332" y="146" width="172" height="68" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="346" y="166" font-weight="700" fill="#1e3a8a">CLAUDE.md</text>
    <text x="346" y="182" font-size="11" fill="#475569">.template</text>
    <text x="346" y="200" font-size="11" fill="#475569">operating contract</text>

    <!-- MEMORY.md.template (blue) -->
    <rect x="516" y="146" width="172" height="68" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="530" y="166" font-weight="700" fill="#1e3a8a">MEMORY.md</text>
    <text x="530" y="182" font-size="11" fill="#475569">.template</text>
    <text x="530" y="200" font-size="11" fill="#475569">auto-memory index seed</text>

    <!-- claude/agents/ (amber, dispatched role) -->
    <rect x="700" y="146" width="172" height="68" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="714" y="166" font-weight="700" fill="#78350f">claude/agents/</text>
    <text x="714" y="184" font-size="11" fill="#475569">developer · devops</text>
    <text x="714" y="200" font-size="11" fill="#475569">+ 5 reviewers/specialists</text>

    <!-- claude/skills/ (amber, invoked role) -->
    <rect x="884" y="146" width="148" height="68" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="898" y="166" font-weight="700" fill="#78350f">claude/skills/</text>
    <text x="898" y="184" font-size="11" fill="#475569">session-start, -completion,</text>
    <text x="898" y="200" font-size="11" fill="#475569">pr-and-review, tidy</text>
  </g>

  <!-- Row 2 -->
  <g font-size="13">
    <!-- claude/failure-patterns.md (amber, on-demand) -->
    <rect x="332" y="226" width="172" height="68" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="346" y="246" font-weight="700" fill="#78350f">failure-patterns</text>
    <text x="346" y="264" font-size="11" fill="#475569">9 generic war stories</text>
    <text x="346" y="280" font-size="11" fill="#475569">claude/failure-patterns.md</text>

    <!-- reference/ (amber, on-demand) -->
    <rect x="516" y="226" width="172" height="68" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="530" y="246" font-weight="700" fill="#78350f">reference/</text>
    <text x="530" y="264" font-size="11" fill="#475569">conceptual deep-dives</text>
    <text x="530" y="280" font-size="11" fill="#475569">linked from CLAUDE.md</text>

    <!-- examples/ (neutral, kit-only) -->
    <rect x="700" y="226" width="172" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="820" y="278" width="46" height="14" rx="7" fill="#94a3b8"/>
    <text x="843" y="288" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff" letter-spacing="0.4">KIT ONLY</text>
    <text x="714" y="246" font-weight="700" fill="#334155">examples/</text>
    <text x="714" y="264" font-size="11" fill="#475569">filled-in CLAUDE.md</text>
    <text x="714" y="280" font-size="11" fill="#475569">for authors</text>

    <!-- README.md (neutral, kit-only) -->
    <rect x="884" y="226" width="148" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="978" y="278" width="46" height="14" rx="7" fill="#94a3b8"/>
    <text x="1001" y="288" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff" letter-spacing="0.4">KIT ONLY</text>
    <text x="898" y="246" font-weight="700" fill="#334155">README.md</text>
    <text x="898" y="264" font-size="11" fill="#475569">human-facing</text>
    <text x="898" y="280" font-size="11" fill="#475569">overview</text>
  </g>

  <!-- Connector — slate-100 ribbon, lighter than zone titles -->
  <line x1="550" y1="320" x2="550" y2="368" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowSlate)"/>
  <rect x="395" y="328" width="310" height="26" rx="13" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="550" y="346" text-anchor="middle" font-size="12" fill="#334155">APPLY.md walks 11 steps  &#183;  approval at every write</text>

  <!-- ============ ZONE 2: INSTALLED ============ -->
  <rect x="60" y="380" width="980" height="280" rx="14" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="84" cy="380" r="18" fill="#0f172a"/>
  <text x="84" y="386" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2</text>
  <text x="112" y="376" font-size="14" font-weight="700" fill="#0f172a">Installed</text>
  <text x="112" y="392" font-size="11" fill="#64748b">what's on disk after APPLY runs</text>

  <!-- Project root column -->
  <rect x="84" y="420" width="464" height="220" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <use href="#glyphFolder" x="100" y="430"/>
  <text x="124" y="442" font-size="13" font-weight="700" fill="#0f172a">your project root</text>
  <text x="280" y="442" font-size="11" fill="#64748b">— shared with collaborators (committed)</text>

  <g font-size="13" fill="#0f172a">
    <!-- CLAUDE.md (blue) -->
    <rect x="100" y="456" width="432" height="38" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="112" y="474" font-weight="700" fill="#1e3a8a">CLAUDE.md</text>
    <rect x="436" y="462" width="84" height="20" rx="10" fill="#1e40af"/>
    <text x="478" y="476" text-anchor="middle" font-size="10" font-weight="600" fill="#dbeafe" letter-spacing="0.5">AUTO-LOADED</text>
    <text x="112" y="488" font-size="11" fill="#475569">operating contract for the project</text>

    <!-- failure-patterns.md (amber) -->
    <rect x="100" y="502" width="432" height="28" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="112" y="521" font-weight="700" fill="#78350f">failure-patterns.md</text>

    <!-- reference/ (amber) -->
    <rect x="100" y="538" width="432" height="28" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="112" y="557" font-weight="700" fill="#78350f">reference/</text>
    <rect x="180" y="546" width="24" height="14" rx="7" fill="#fbbf24"/>
    <text x="192" y="557" text-anchor="middle" font-size="10" font-weight="700" fill="#78350f">7</text>
    <text x="218" y="557" font-size="11" fill="#475569">conceptual docs</text>

    <!-- .claude/skills/ (amber) -->
    <rect x="100" y="574" width="432" height="28" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="112" y="593" font-weight="700" fill="#78350f">.claude/skills/</text>
    <rect x="206" y="582" width="24" height="14" rx="7" fill="#fbbf24"/>
    <text x="218" y="593" text-anchor="middle" font-size="10" font-weight="700" fill="#78350f">4</text>

    <!-- tasks.jsonl (pink) + .claude/settings.json (neutral) — paired so right column ends at the same y -->
    <rect x="100" y="610" width="210" height="22" rx="6" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1"/>
    <text x="112" y="626" font-weight="700" fill="#831843">tasks.jsonl</text>

    <rect x="322" y="610" width="210" height="22" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="334" y="626" font-size="12" font-weight="600" fill="#78350f">.claude/settings.json</text>
    <text x="525" y="626" font-size="9" fill="#92400e" text-anchor="end" font-style="italic">hooks</text>
  </g>

  <!-- ~/.claude/ column -->
  <rect x="560" y="420" width="464" height="220" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <use href="#glyphHome" x="576" y="430"/>
  <text x="600" y="442" font-size="13" font-weight="700" fill="#0f172a">~/.claude/</text>
  <text x="676" y="442" font-size="11" fill="#64748b">— your toolbox (every project, not committed)</text>

  <g font-size="13" fill="#0f172a">
    <!-- agents/ (amber) -->
    <rect x="576" y="456" width="432" height="80" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="588" y="476" font-weight="700" fill="#78350f">agents/</text>
    <rect x="652" y="463" width="24" height="16" rx="8" fill="#fbbf24"/>
    <text x="664" y="475" text-anchor="middle" font-size="10" font-weight="700" fill="#78350f">7</text>
    <text x="588" y="494" font-size="11" fill="#475569">developer  &#183;  frontend-craftsman  &#183;  devops</text>
    <text x="588" y="510" font-size="11" fill="#475569">security-auditor  &#183;  code-reviewer</text>
    <text x="588" y="526" font-size="11" fill="#475569">in-depth-code-reviewer  &#183;  plan-reviewer</text>

    <!-- memory/MEMORY.md (blue) -->
    <rect x="576" y="544" width="432" height="58" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="588" y="564" font-weight="700" fill="#1e3a8a">projects/&lt;slug&gt;/memory/MEMORY.md</text>
    <rect x="912" y="552" width="84" height="20" rx="10" fill="#1e40af"/>
    <text x="954" y="566" text-anchor="middle" font-size="10" font-weight="600" fill="#dbeafe" letter-spacing="0.5">AUTO-LOADED</text>
    <text x="588" y="582" font-size="11" fill="#475569">typed entries: user / feedback / project / reference</text>
    <text x="588" y="596" font-size="11" fill="#475569">topic files load on demand from the index</text>

  </g>

  <!-- Connector — light, restating zone title -->
  <line x1="550" y1="670" x2="550" y2="718" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowSlate)"/>
  <rect x="395" y="678" width="310" height="26" rx="13" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="550" y="696" text-anchor="middle" font-size="12" fill="#334155">a Claude session opens in your project</text>

  <!-- ============ ZONE 3: LIVE SESSION ============ -->
  <rect x="60" y="730" width="980" height="340" rx="14" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  <circle cx="84" cy="730" r="18" fill="#0f172a"/>
  <text x="84" y="736" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">3</text>
  <text x="112" y="726" font-size="14" font-weight="700" fill="#0f172a">Live session</text>
  <text x="112" y="742" font-size="11" fill="#64748b">the main agent steers; the kit pieces serve</text>

  <!-- Auto-loaded inputs — top, blue -->
  <rect x="120" y="788" width="200" height="48" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="220" y="809" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">CLAUDE.md</text>
  <text x="220" y="825" text-anchor="middle" font-size="10" fill="#1e40af" letter-spacing="0.4">AUTO-LOADED · EVERY TURN</text>

  <rect x="780" y="788" width="200" height="48" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="880" y="809" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">MEMORY.md (+ topics)</text>
  <text x="880" y="825" text-anchor="middle" font-size="10" fill="#1e40af" letter-spacing="0.4">AUTO-LOADED · EVERY TURN</text>

  <!-- Main agent — center -->
  <ellipse cx="550" cy="900" rx="130" ry="48" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
  <text x="550" y="896" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Main agent</text>
  <text x="550" y="916" text-anchor="middle" font-size="12" fill="#475569">steers · decides · dispatches</text>

  <!-- Arrows from auto-loaded inputs to ellipse top — Manhattan routing -->
  <path d="M 220 836 L 220 870 L 425 870 L 425 894" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowSlate)"/>
  <path d="M 880 836 L 880 870 L 675 870 L 675 894" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowSlate)"/>

  <!-- On-demand outputs — bottom, amber + pink -->
  <rect x="100" y="990" width="216" height="58" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="208" y="1010" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">.claude/skills/</text>
  <text x="208" y="1026" text-anchor="middle" font-size="10" fill="#92400e" letter-spacing="0.4">INVOKED · SKILL TOOL</text>
  <text x="208" y="1040" text-anchor="middle" font-size="10" fill="#92400e">/session-start · /tidy · …</text>

  <rect x="332" y="990" width="216" height="58" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="440" y="1010" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">~/.claude/agents/</text>
  <text x="440" y="1026" text-anchor="middle" font-size="10" fill="#92400e" letter-spacing="0.4">DISPATCHED · TASK TOOL</text>
  <text x="440" y="1040" text-anchor="middle" font-size="10" fill="#92400e">developer · code-reviewer · …</text>

  <rect x="564" y="990" width="216" height="58" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="672" y="1010" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">reference/  &#183;  failure-patterns</text>
  <text x="672" y="1026" text-anchor="middle" font-size="10" fill="#92400e" letter-spacing="0.4">READ ON DEMAND</text>
  <text x="672" y="1040" text-anchor="middle" font-size="10" fill="#92400e">when CLAUDE.md links to them</text>

  <rect x="796" y="990" width="184" height="58" rx="8" fill="#fdf2f8" stroke="#f472b6" stroke-width="1.2"/>
  <text x="888" y="1010" text-anchor="middle" font-size="13" font-weight="700" fill="#831843">tasks.jsonl</text>
  <text x="888" y="1026" text-anchor="middle" font-size="10" fill="#9d174d" letter-spacing="0.4">↑ READ AT START</text>
  <text x="888" y="1040" text-anchor="middle" font-size="10" fill="#9d174d" letter-spacing="0.4">↓ WRITTEN AT END</text>

  <!-- Arrows from ellipse to outputs — Manhattan routing, evenly distributed -->
  <path d="M 460 942 L 460 970 L 208 970 L 208 990" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowSlate)"/>
  <path d="M 500 944 L 500 970 L 440 970 L 440 990" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowSlate)"/>
  <path d="M 600 944 L 600 970 L 672 970 L 672 990" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowSlate)"/>
  <path d="M 640 942 L 640 970 L 888 970 L 888 990" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowSlate)"/>

  <!-- ============ LEGEND ============ -->
  <g transform="translate(60, 1110)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="22" y="11" font-size="11" fill="#475569">auto-loaded into context every turn</text>

    <rect x="280" y="0" width="14" height="14" rx="3" fill="#fffbeb" stroke="#fbbf24"/>
    <text x="302" y="11" font-size="11" fill="#475569">invoked or dispatched on demand</text>

    <rect x="560" y="0" width="14" height="14" rx="3" fill="#fdf2f8" stroke="#f472b6"/>
    <text x="582" y="11" font-size="11" fill="#475569">read at session start, written at session end</text>

    <rect x="840" y="0" width="14" height="14" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="862" y="11" font-size="11" fill="#475569">kit-only · never installed</text>
  </g>
</svg>
